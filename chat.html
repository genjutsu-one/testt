<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чат</title>
<style>
  :root{
    --bg:#0e0d12; --panel:#17151d; --line:#2a2733; --text:#ece9f2; --muted:#8b869b;
    --me:#3b2a5c; --ai:#1d1a25; --accent:#b79cff; --danger:#ff7a8a;
    --font:"Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;
    --mono:ui-monospace,"SF Mono",Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{background:radial-gradient(900px 500px at 80% -10%,#251a40 0%,transparent 60%),var(--bg);
    color:var(--text);font-family:var(--font);display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);
    background:rgba(14,13,18,.8);backdrop-filter:blur(10px)}
  header h1{font-size:16px;font-weight:600;flex:1}
  .btn{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;transition:border-color .15s,background .15s}
  .btn:hover{border-color:var(--accent)}
  .btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #log{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
  .msg{max-width:min(720px,88%);padding:11px 14px;border-radius:16px;line-height:1.55;font-size:15px;
    white-space:pre-wrap;word-wrap:break-word;border:1px solid var(--line)}
  .msg.user{align-self:flex-end;background:var(--me);border-color:#4d3a75;border-bottom-right-radius:4px}
  .msg.assistant{align-self:flex-start;background:var(--ai);border-bottom-left-radius:4px}
  .msg.error{align-self:center;color:var(--danger);border-color:#5a2a33;background:#22141a;font-size:13px;max-width:92%}
  .msg code{font-family:var(--mono);font-size:13px;background:#0b0a0f;padding:1px 5px;border-radius:5px}
  .msg pre{font-family:var(--mono);font-size:13px;background:#0b0a0f;border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;margin:8px 0;overflow-x:auto;white-space:pre}
  .empty{margin:auto;text-align:center;color:var(--muted);font-size:14px;line-height:1.6}
  .dots span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
  .dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:rgba(14,13,18,.8)}
  textarea{flex:1;resize:none;max-height:160px;background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:12px;padding:11px 14px;font:inherit;font-size:15px;line-height:1.4}
  #send{background:var(--accent);color:#1a1230;border:0;border-radius:12px;padding:0 18px;font-weight:600;cursor:pointer}
  #send:disabled{opacity:.5;cursor:default}

  dialog{margin:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;
    padding:20px;width:min(440px,92vw)}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog h2{font-size:16px;margin-bottom:14px}
  label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px}
  input,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;font:inherit;font-size:14px}
  input.mono{font-family:var(--mono);font-size:13px}
  .row{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header>
  <h1>Чат с ИИ</h1>
  <button class="btn" id="clear" type="button">Очистить</button>
  <button class="btn" id="open-settings" type="button">Настройки</button>
</header>

<main id="log"></main>

<form id="form">
  <textarea id="input" rows="1" placeholder="Напиши сообщение… (Enter — отправить, Shift+Enter — перенос)"></textarea>
  <button id="send" type="submit">Отправить</button>
</form>

<dialog id="settings">
  <h2>Настройки API</h2>
  <label for="key">API ключ</label>
  <input id="key" class="mono" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false">
  <label for="endpoint">Endpoint</label>
  <input id="endpoint" class="mono" type="text" spellcheck="false">
  <label for="model">Модель</label>
  <select id="model"></select>
  <label for="system">Системный промпт (необязательно)</label>
  <input id="system" type="text" placeholder="Например: отвечай коротко">
  <p class="hint">Всё хранится только в твоём браузере (localStorage) и уходит только на указанный endpoint.</p>
  <div class="row">
    <button class="btn" id="cancel" type="button">Отмена</button>
    <button class="btn" id="save" type="button" style="border-color:var(--accent)">Сохранить</button>
  </div>
</dialog>

<script>
const MODELS = ["claude-opus-5","claude-opus-4-8","claude-opus-4-7","claude-sonnet-5","claude-sonnet-4-6","claude-haiku-4-5","claude-fable-5"];
const DEFAULTS = { key:"", endpoint:"https://api.xpiki.com/v1", model:"claude-sonnet-5", system:"" };

const $ = id => document.getElementById(id);
const log = $("log"), input = $("input"), sendBtn = $("send"), dlg = $("settings");

let cfg = load();
let history = [];
let busy = false;

function load(){
  try { return { ...DEFAULTS, ...JSON.parse(localStorage.getItem("chat-cfg") || "{}") }; }
  catch { return { ...DEFAULTS }; }
}
function persist(){
  try { localStorage.setItem("chat-cfg", JSON.stringify(cfg)); } catch {}
}

$("model").innerHTML = MODELS.map(m => `<option>${m}</option>`).join("");

function openSettings(){
  $("key").value = cfg.key;
  $("endpoint").value = cfg.endpoint;
  $("model").value = cfg.model;
  $("system").value = cfg.system;
  dlg.showModal();
}
$("open-settings").onclick = openSettings;
$("cancel").onclick = () => dlg.close();
$("save").onclick = () => {
  cfg = {
    key: $("key").value.trim(),
    endpoint: $("endpoint").value.trim().replace(/\/+$/,""),
    model: $("model").value,
    system: $("system").value.trim()
  };
  persist();
  dlg.close();
};

$("clear").onclick = () => { history = []; render(); };

function esc(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function md(s){
  const parts = s.split(/```/);
  return parts.map((p,i) => {
    if (i % 2) return "<pre>" + esc(p.replace(/^[^\n]*\n/,"")) + "</pre>";
    return esc(p).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");
  }).join("");
}

function render(){
  if (!history.length){
    log.innerHTML = '<div class="empty">Пока пусто.<br>Вставь ключ в «Настройки» и пиши.</div>';
    return;
  }
  log.innerHTML = "";
  history.forEach(m => addBubble(m.role, m.content));
}
function addBubble(role, text, html){
  const d = document.createElement("div");
  d.className = "msg " + role;
  if (html) d.innerHTML = html; else d.innerHTML = role === "assistant" ? md(text) : esc(text);
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

async function ask(text){
  if (!cfg.key){ openSettings(); return; }
  busy = true; sendBtn.disabled = true;
  history.push({ role:"user", content:text });
  render();
  const bubble = addBubble("assistant", "", '<span class="dots"><span></span><span></span><span></span></span>');

  const messages = [];
  if (cfg.system) messages.push({ role:"system", content:cfg.system });
  messages.push(...history);

  try {
    const res = await fetch(cfg.endpoint + "/chat/completions", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + cfg.key },
      body: JSON.stringify({ model:cfg.model, messages, stream:true })
    });
    if (!res.ok){
      const t = await res.text();
      throw new Error("HTTP " + res.status + ": " + t.slice(0,300));
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "", out = "";
    while (true){
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines){
        const l = line.trim();
        if (!l.startsWith("data:")) continue;
        const data = l.slice(5).trim();
        if (data === "[DONE]") continue;
        try {
          const delta = JSON.parse(data).choices?.[0]?.delta?.content;
          if (delta){ out += delta; bubble.innerHTML = md(out); log.scrollTop = log.scrollHeight; }
        } catch {}
      }
    }
    if (!out) throw new Error("Пустой ответ от сервера");
    history.push({ role:"assistant", content:out });
  } catch (e){
    history.pop();
    bubble.remove();
    addBubble("error", "Ошибка: " + e.message);
    history.length || (log.innerHTML += "");
  } finally {
    busy = false; sendBtn.disabled = false; input.focus();
  }
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const t = input.value.trim();
  if (!t || busy) return;
  input.value = ""; autosize();
  ask(t);
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("form").requestSubmit(); }
});
function autosize(){ input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight,160) + "px"; }
input.addEventListener("input", autosize);

render();
if (!cfg.key) setTimeout(openSettings, 300);
</script>
</body>
</html>
