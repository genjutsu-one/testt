f.querySelector('.tg').replaceChildren(...p.t.map(t=>{const x=document.createElement('span');x.className='t';x.textContent=t;return x}))}),{root:FD,rootMargin:'250% 0px'});
const iac=new IntersectionObserver(es=>es.forEach(e=>{const f=e.target,v=f.querySelector('video');
if(e.isIntersecting){cur=+f.dataset.i;if(!f._b){f._b=1;bump(S.list[cur],.5)}v&&v.play().catch(()=>{});if(cur>S.list.length-6)more()}else v&&v.pause()}),{root:FD,threshold:.6});
async function more(){
if(S.busy||S.mode==='fav')return;
S.busy=1;$('s').className=S.list.length?'':'mid';$('s').innerHTML='<i class="sp"></i>';
const gn=S.gen;let n=0,t=0;
while(n<12&&t++<4){
const ss=[...S.src].filter(s=>!S.end[s]);if(!ss.length)break;
const y=S.mode==='you';
const base=y?[pickTags(),S.q].join(' ').trim():S.q;
const rs=await Promise.all(ss.map(s=>fetchSrc(s,base,y?Math.floor(Math.random()*8):S.pg[s]++)));
if(gn!==S.gen)return;
const bt=[];
rs.forEach((r,i)=>{if(r.e){S.er[ss[i]]=r.e;S.end[ss[i]]=1}else{if(!r.a.length&&!y)S.end[ss[i]]=1;bt.push(r.a)}});
const m=[];const mx=Math.max(0,...bt.map(x=>x.length));
for(let i=0;i<mx;i++)bt.forEach(x=>x[i]&&m.push(x[i]));
const f=m.filter(p=>!S.seen.has(p.k)&&!bad(p));
f.forEach(p=>S.seen.add(p.k));
if(y)f.sort((a,b)=>score(b)-score(a));
S.k=0;f.forEach(card);n+=f.length}
S.busy=0;
const er=Object.entries(S.er).map(([s,m])=>NM[s]+': '+m);
const alive=[...S.src].some(s=>!S.end[s]);
$('s').className=(S.list.length?'':'mid')+(er.length?' er':'');
$('s').textContent=er.length?er.join(' · ')+' — тап, чтобы повторить':(!alive?(S.list.length?'':'Ничего не найдено'):'');
if(n)chk()}
$('s').onclick=()=>{if($('s').classList.contains('er')){Object.keys(S.er).forEach(s=>{S.end[s]=0;delete S.er[s]});more()}};
const chk=()=>{if(S.view==='grid'&&innerHeight+scrollY>document.body.scrollHeight-1200)more()};
let ly=0;
onscroll=()=>{if(S.view!=='grid')return;chk();const y=scrollY,d=y-ly;if(Math.abs(d)>8){$('H').classList.toggle('hd',d>0&&y>140);ly=y}};
const MI={feed:0,you:1,fav:2};
const thumb=i=>$('nvi').style.transform=`translateX(${i*100}%)`;
function mark(){
[['feed','m1'],['you','m2'],['fav','m3']].forEach(([m,i])=>$(i).classList.toggle('on',S.mode===m));
document.querySelectorAll('#tb button').forEach(b=>b.classList.toggle('on',b.dataset.s===S.src));
thumb(MI[S.mode])}
function applyView(){document.body.classList.toggle('gv',S.view==='grid');$('vb').innerHTML=ic(S.view==='grid'?P.feed:P.grid);$('H').classList.remove('hd')}
function openFeed(i){S.view='feed';sv('vw','feed');applyView();FD.scrollTop=i*FD.clientHeight}
$('vb').onclick=()=>{if(S.view==='grid')openFeed(cur);else{S.view='grid';sv('vw','grid');applyView();const p=S.list[cur];if(p)EL.get(p.k)?.scrollIntoView({block:'center'})}};
function go(){
S.gen++;S.busy=0;S.pg={g:0,r:0};S.end={g:0,r:0};S.er={};S.seen=new Set();S.list=[];S.k=0;cur=0;EL.clear();$('g').innerHTML='';FD.innerHTML='';FD.scrollTop=0;scrollTo(0,0);$('s').className='';$('s').textContent='';
if(S.mode==='fav'){const q=S.q.split(/\s+/).filter(Boolean);Object.values(fav).reverse().filter(p=>q.every(t=>p.t.includes(t))).forEach(card);if(!S.list.length){$('s').className='mid';$('s').textContent='Пока пусто'}return}
more()}
$('q').onkeydown=e=>{if(e.key==='Enter'){S.q=$('q').value.trim();go();e.target.blur()}};
$('sbt').onclick=()=>{const h=$('H');h.classList.toggle('sr');if(h.classList.contains('sr'))setTimeout(()=>$('q').focus(),150)};
document.querySelectorAll('#tb button').forEach(b=>b.onclick=()=>{S.src=b.dataset.s;mark();go()});
[['m1','feed'],['m2','you'],['m3','fav']].forEach(([i,m])=>$(i).onclick=()=>{if(S.mode===m&&S.view==='grid')scrollTo({top:0,behavior:'smooth'});S.mode=m;mark();go()});
/* действия в ленте */
function like(i){const p=S.list[i];if(fav[p.k]){delete fav[p.k];bump(p,-3)}else{fav[p.k]=p;bump(p,3)}sv('fav',fav);const on=!!fav[p.k];FD.children[i]?.querySelector('.fv').classList.toggle('on',on);EL.get(p.k)?.classList.toggle('f2',on)}
function burst(x,y){const b=document.createElement('div');b.className='bu';b.style.left=x+'px';b.style.top=y+'px';b.innerHTML=ic(P.heart);document.body.append(b);setTimeout(()=>b.remove(),850)}
async function dl(p){const n=p.f.split('/').pop().split('?')[0];toast('Скачиваю...');try{const r=await fetch(wrap(p.f));if(!r.ok)throw 0;const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e4);toast('Сохранено')}catch{window.open(p.f,'_blank')}}
let lt=0;
FD.addEventListener('click',e=>{
const f=e.target.closest('.f');if(!f)return;const i=+f.dataset.i,p=S.list[i];
const b=e.target.closest('button');
if(b){if(b.classList.contains('fv'))like(i);else if(b.classList.contains('hd')){bump(p,-2);FD.children[i+1]?.scrollIntoView({behavior:'smooth'})}else if(b.classList.contains('dl'))dl(p);return}
const t=e.target.closest('.t');
if(t){$('q').value=S.q=t.textContent;if(S.mode==='fav')S.mode='feed';mark();go();return}
const n=Date.now();
if(n-lt<320){burst(e.clientX,e.clientY);if(!fav[p.k])like(i);lt=0}else lt=n});
onkeydown=e=>{if(S.view!=='feed'||$('p').classList.contains('o')||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
if(e.key==='ArrowDown'||e.key==='ArrowRight')FD.scrollBy({top:FD.clientHeight,behavior:'smooth'});
if(e.key==='ArrowUp'||e.key==='ArrowLeft')FD.scrollBy({top:-FD.clientHeight,behavior:'smooth'});
if(e.key==='Escape')$('vb').click()};
/* настройки */
function ints(){
const t=topT();
if(!t.length){$('iw').innerHTML='<span style="color:var(--mu);font-size:13px">пока пусто</span>';return}
$('iw').replaceChildren(...t.map(([k,w])=>{const e=document.createElement('span');e.className='t';e.textContent=k+' '+w.toFixed(1);e.onclick=()=>{delete W[k];sv('w',W);ints()};return e}))}
function applyLg(){document.documentElement.classList.toggle('lg',!!lg);$('lgb').classList.toggle('on',!!lg)}
$('lgb').onclick=()=>{lg=lg?0:1;sv('lg',lg);applyLg()};
$('m4').onclick=()=>{$('bt').value=bl.join(' ');$('px').value=cp;ints();$('p').classList.add('o');thumb(3)};
function closeP(){const n=$('bt').value.trim().split(/\s+/).filter(Boolean);const np=$('px').value.trim();$('p').classList.remove('o');thumb(MI[S.mode]);
const ch=n.join(' ')!==bl.join(' ')||np!==cp;
bl=n;sv('bl',bl);if(np!==cp){cp=np;sv('px',cp)}
if(ch)go()}
$('pc').onclick=closeP;
$('p').onclick=e=>{if(e.target===$('p'))closeP()};
$('rs').onclick=()=>{W={};sv('w',W);ints()};
const GL='nav,.sb,.ib,.vb,#sh,.sw,.pb,.cap .t,#iw .t';
addEventListener('pointermove',e=>{if(!lg)return;const g=e.target.closest&&e.target.closest(GL);if(!g)return;const r=g.getBoundingClientRect();g.style.setProperty('--mx',e.clientX-r.left+'px');g.style.setProperty('--my',e.clientY-r.top+'px')},{passive:true});
applyLg();applyView();mark();go();
</script></body></html>
